name: Research snapshot
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/research-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/tools
          persist-credentials: false
      - run: python research/tools/acquire_indusscript_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-public-corpus
          path: /tmp/ivc-public-corpus/
          retention-days: 3
