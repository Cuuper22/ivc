name: Research snapshot
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/research-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/tools
          persist-credentials: false
      - run: python research/tools/acquire_numerical_source_packet.py
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-source-packet
          path: /tmp/ivc-source-packet/
          retention-days: 3
