name: Mahadevan frozen-evidence audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/tools
            research/data/mahadevan_20260905
          persist-credentials: false
      - name: Recompute from the frozen scholarly corpus
        run: |
          python research/tools/mahadevan_constraint_audit.py \
            --input research/data/mahadevan_20260905/concordance_documents.json.gz \
            --output /tmp/ivc-mahadevan-audit
      - name: Check preserved evidence and exact result reproduction
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,hashlib,json
          source=Path('research/data/mahadevan_20260905')
          generated=Path('/tmp/ivc-mahadevan-audit')
          manifest=json.loads((source/'snapshot.sha256.json').read_text())
          for name,expected in manifest.items():
              actual=hashlib.sha256((source/name).read_bytes()).hexdigest()
              if actual!=expected:raise RuntimeError('Preserved evidence hash mismatch: '+name)
          for p in generated.iterdir():
              if p.name=='files.sha256.json':continue
              expected=source/p.name
              if p.suffix=='.json':ok=json.loads(p.read_text())==json.loads(expected.read_text())
              elif p.suffix=='.gz':ok=gzip.decompress(p.read_bytes())==gzip.decompress(expected.read_bytes())
              else:ok=p.read_bytes()==expected.read_bytes()
              if not ok:raise RuntimeError('Research result mismatch: '+p.name)
          families=json.loads((source/'front_families.json').read_text())
          assert sum(len(f['objects_by_long_stroke_count']) for f in families)==51
          assert sum(max(map(len,f['objects_by_long_stroke_count'].values())) for f in families)==63
          print('Frozen evidence hashes and reproduced research results agree.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mahadevan-reproduced-results
          path: /tmp/ivc-mahadevan-audit/
          retention-days: 7
