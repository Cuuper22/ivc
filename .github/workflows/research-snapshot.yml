name: Research snapshot
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/research-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            evidence/tmp/032_002_861_603_slot_source_normalization
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-vats-original
          path: evidence/tmp/032_002_861_603_slot_source_normalization/vats_excavations_at_harappa_vol2_plates.pdf
          retention-days: 3
