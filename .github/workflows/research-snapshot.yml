name: Research snapshot
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/research-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/tools
          persist-credentials: false
      - run: python -m pip install --quiet pymupdf
      - run: python research/tools/verify_vats_numerical_plate.py
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-vats-plate
          path: /tmp/ivc-vats-plate/
          retention-days: 3
