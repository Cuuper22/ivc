name: Compositional reading search
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/tools
            research/data/mahadevan_20260905
          persist-credentials: false
      - name: Search compositional reading hypotheses
        run: |
          python research/tools/semantic_transducer_search.py \
            --input research/data/mahadevan_20260905/concordance_documents.json.gz \
            --output /tmp/ivc-semantic-search
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-semantic-search
          path: /tmp/ivc-semantic-search/
          retention-days: 7
