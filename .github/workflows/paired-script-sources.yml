name: Paired-script public source acquisition
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/paired-script-sources.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve public interface and linked scripts
        run: |
          python - <<'PY'
          import pathlib,urllib.request,urllib.parse,re,json,hashlib,concurrent.futures
          out=pathlib.Path('/tmp/ivc-paired-script');out.mkdir()
          log=[]
          def get(url,name):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as f:b=f.read(25000000);ct=f.headers.get('Content-Type')
                  (out/name).write_bytes(b)
                  log.append({'url':url,'file':name,'bytes':len(b),'content_type':ct,'sha256':hashlib.sha256(b).hexdigest()})
                  return b.decode('utf-8',errors='replace')
              except Exception as e:log.append({'url':url,'file':name,'error':str(e)});return ''
          html=get('https://tngraffiti.in/','index.html')
          scripts={urllib.parse.urljoin('https://tngraffiti.in/',s) for s in re.findall(r'(?:src|href)=[\"\']([^\"\']+\.js(?:\?[^\"\']*)?)[\"\']',html)}
          # Flutter's bootstrap points to its public main entrypoint.
          body=''
          for i,url in enumerate(sorted(scripts)):body+=get(url,f'script_{i}.js')
          names=set(re.findall(r'([A-Za-z0-9_./-]+\.js)',body))
          for name in ['main.dart.js','flutter_bootstrap.js']:
              if name in names and not any(u.endswith(name) for u in scripts):get(urllib.parse.urljoin('https://tngraffiti.in/',name),name)
          get('https://tngraffiti.in/robots.txt','robots.txt')
          (out/'manifest.json').write_text(json.dumps(log,indent=2))
          print(json.dumps(log,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-paired-script-interface
          path: /tmp/ivc-paired-script/
          retention-days: 7
