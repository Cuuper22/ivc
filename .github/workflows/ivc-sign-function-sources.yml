name: Sign-function research sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ivc-sign-function-sources.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public research slides
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json
          out=pathlib.Path('/tmp/ivc-contact-slides');out.mkdir()
          url='https://www.antichecivilta.it/wp-content/uploads/2023/11/PERCHE_STUDIARE_LA_TRADIZIONE_DELLA_VALL.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=90) as response:
              data=response.read()
          if not data.startswith(b'%PDF'):raise ValueError('Expected a PDF')
          p=out/'frenez_2023_slides.pdf';p.write_bytes(data)
          (out/'manifest.json').write_text(json.dumps({'url':url,'file':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()},indent=2))
          print('Retrieved',len(data),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-contact-slides
          path: /tmp/ivc-contact-slides/
          retention-days: 7
