name: Sign-function research sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ivc-sign-function-sources.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/H-148_a.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/H-243_A.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/H-243_B.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/H-888_A.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/H-945_A.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/K-33_a.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/M-1086_a.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/M-1086_a_bis.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/M-1148_A_bis.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/M-1148_A_ter.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/M-1148_a.jpg
            /evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/M-729_a.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-modifier-photographs
          path: evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/public/seal_images/
          retention-days: 7
