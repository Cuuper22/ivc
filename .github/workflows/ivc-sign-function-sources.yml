name: Sign-function research sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ivc-sign-function-sources.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download publisher open-access research volume
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, json
          out=pathlib.Path('/tmp/ivc-susa-edition');out.mkdir()
          url='https://www.orientlab.net/download/588/?tmstv=1785922356'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=90) as response:
              data=response.read()
          if not data.startswith(b'%PDF'):raise ValueError('The publisher did not return a PDF')
          p=out/'linear_elamite_susa_2026.pdf';p.write_bytes(data)
          (out/'manifest.json').write_text(json.dumps({'url':url,'file':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()},indent=2))
          print('Retrieved',len(data),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-susa-edition
          path: /tmp/ivc-susa-edition/
          retention-days: 7
