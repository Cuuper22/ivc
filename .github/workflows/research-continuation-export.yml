name: Export existing lexical evidence
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/research-continuation-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/dev-tools/ashtadhyayi/assets/mw.xml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Extract existing dictionary headwords and source references
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,re,json,gzip,hashlib
          p=Path('evidence/tmp/002390x_3335_yajnadevam_repo_trace_20260531/repo/dev-tools/ashtadhyayi/assets/mw.xml')
          out=Path('/tmp/ivc-lexical-evidence');out.mkdir()
          records=[]
          for _,e in ET.iterparse(p,events=['end']):
              if not re.fullmatch(r'H[1-4][AB]?',e.tag):continue
              w=e.findtext('./h/key1')
              if w and re.fullmatch('[A-Za-z]+',w):
                  b=e.find('body');text=' '.join(b.itertext()) if b is not None else ''
                  records.append({'word':w,'entry_id':e.findtext('./tail/L'),'page_column':e.findtext('./tail/pc'),'gloss':text})
              e.clear()
          raw=json.dumps(records,ensure_ascii=False).encode()
          (out/'mw_headwords.json.gz').write_bytes(gzip.compress(raw,mtime=0))
          (out/'manifest.json').write_text(json.dumps({'source_repository_path':str(p),'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'records':len(records),'unique_words':len({r['word'] for r in records}),'output_sha256':hashlib.sha256(raw).hexdigest()},indent=2))
          print('Entries',len(records),'words',len({r['word'] for r in records}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ivc-lexical-evidence
          path: /tmp/ivc-lexical-evidence/
          retention-days: 7
