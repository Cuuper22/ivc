name: Research input acquisition
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/graphemic-research.yml']
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/tools
          persist-credentials: false
      - name: Retrieve narrowly selected original repository images
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib
          out=Path('/tmp/indus-candidate-witnesses');out.mkdir()
          names=['H-1014','H-1785','M-1063','M-1384','M-2118','M-2121','M-1892','H-380','H-381','C-94','M-2093','M-2094','M-2095','M-2096']
          entries=subprocess.check_output(['git','ls-tree','-r','HEAD'],text=True).splitlines()
          paths=[x.split('\t',1)[1] for x in entries]
          selected=[p for p in paths if '/seal_images/' in p and any(Path(p).name.startswith(n+'_') for n in names)]
          manifest=[]
          for p in selected:
              b=subprocess.check_output(['git','show','HEAD:'+p],timeout=50)
              name=Path(p).name;(out/name).write_bytes(b)
              manifest.append({'file':name,'repository_path':p,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Retrieved',len(manifest),'candidate witnesses')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: indus-candidate-witnesses
          path: /tmp/indus-candidate-witnesses/
          retention-days: 7
