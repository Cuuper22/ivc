name: Research input acquisition
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/graphemic-research.yml']
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve public research data and its linked vessel documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,urllib.parse,re,json,hashlib,concurrent.futures,html
          out=Path('/tmp/indus-external-input');out.mkdir()
          manifest=[]
          def get(url,name):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (scholarly data research)'})
                  with urllib.request.urlopen(req,timeout=35) as r:b=r.read(25000001);ct=r.headers.get('Content-Type','')
                  if len(b)>25000000:raise ValueError('Per-file size limit exceeded')
                  (out/name).write_bytes(b);manifest.append(dict(url=url,file=name,content_type=ct,bytes=len(b),sha256=hashlib.sha256(b).hexdigest()))
                  return b
              except Exception as e:manifest.append(dict(url=url,file=name,error=str(e)));return b''
          pages=[('dataset','https://www.repository.cam.ac.uk/items/2a3c9cb0-5a81-49ac-afb2-0c567f9024ea'),('article','https://www.repository.cam.ac.uk/items/7a73223e-aa56-49d6-b0b9-cdaf44313b91')]
          urls=set()
          for name,url in pages:
              text=get(url,name+'.html').decode('utf-8',errors='replace')
              for u in re.findall(r'(?:https://[^\s\"<>]+)?/bitstreams/[a-f0-9-]+/download',html.unescape(text)):
                  urls.add(urllib.parse.urljoin(url,u))
          def grab(pair):
              i,u=pair;get(u,f'resource_{i:02d}.bin')
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(grab,enumerate(sorted(urls)[:16])))
          get('https://helda.helsinki.fi/server/api/core/bitstreams/5994c972-f2c5-4520-954d-8a9b63d27b25/content','parpola_ivory.pdf')
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2));print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: indus-external-input
          path: /tmp/indus-external-input/
          retention-days: 7
